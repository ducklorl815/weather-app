<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>部門組織</title>
  <style>
    :root {
      --bg: #f0f2f5;
      --panel: #ffffff;
      --text: #1a1815;
      --text-sub: #5c5650;
      --border: #d0d5dc;
      --accent: #2f5a8a;
      --connector: #4a90d9;
      --node-bg: #e8f0fa;
      --node-border: #4a90d9;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      font-family: "Segoe UI", "Microsoft JhengHei", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    .toolbar {
      flex-shrink: 0;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px 16px;
      padding: 10px 16px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
    }
    .toolbar h1 {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 700;
      margin-right: auto;
    }
    .toolbar-status {
      font-size: 0.82rem;
      color: var(--text-sub);
      min-width: 120px;
    }
    .toolbar-btn {
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 0.82rem;
      cursor: pointer;
    }
    .toolbar-btn:hover { background: #eef2f7; }
    .toolbar-btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .root-drop {
      border: 1px dashed var(--border);
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 0.8rem;
      color: var(--text-sub);
      background: #f7f9fc;
    }
    .root-drop.is-drag-over {
      border-color: var(--accent);
      background: #dce8f5;
    }
    .canvas-wrap {
      flex: 1;
      overflow: auto;
      position: relative;
      background:
        radial-gradient(circle at 1px 1px, rgba(0, 0, 0, 0.04) 1px, transparent 0) 0 0 / 20px 20px,
        var(--bg);
    }
    .canvas-inner {
      transform-origin: top center;
      padding: 32px 48px 64px;
      min-width: min-content;
      min-height: min-content;
    }
    .dept-org-tb-forest {
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-start;
      gap: 48px;
    }
    .dept-org-tb-branch {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex-shrink: 0;
    }
    .dept-org-tb-children {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .dept-org-tb-v-stub {
      width: 2px;
      height: 28px;
      background: var(--connector);
      flex-shrink: 0;
    }
    .dept-org-tb-h-stack {
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      justify-content: center;
      gap: 16px;
      position: relative;
      border-top: 2px solid var(--connector);
      padding-top: 0;
    }
    .dept-org-tb-h-stack.is-single {
      border-top-color: transparent;
    }
    .dept-org-tb-child-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      flex: 0 0 auto;
      box-sizing: border-box;
    }
    .dept-org-tb-node-anchor {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }
    .dept-org-tb-slot-children {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .dept-org-tb-child-col:first-child::before,
    .dept-org-tb-child-col:last-child::before {
      content: '';
      position: absolute;
      top: -2px;
      height: 2px;
      background: var(--bg);
      z-index: 1;
    }
    .dept-org-tb-child-col:first-child::before { left: 0; right: 50%; }
    .dept-org-tb-child-col:last-child::before { left: 50%; right: 0; }
    .dept-org-tb-h-stack.is-single .dept-org-tb-child-col::before { display: none; }
    .dept-org-tb-v-link {
      width: 2px;
      height: 28px;
      background: var(--connector);
      margin-top: -2px;
      flex-shrink: 0;
    }
    .dept-org-node {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      min-width: 110px;
      max-width: 180px;
      padding: 10px 12px;
      border: 2px solid var(--node-border);
      border-radius: 6px;
      background: var(--node-bg);
      cursor: grab;
      user-select: none;
      text-align: center;
      line-height: 1.35;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
    }
    .dept-org-node:active { cursor: grabbing; }
    .dept-org-node.is-dragging { opacity: 0.45; }
    .dept-org-node.is-drag-over {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(47, 90, 138, 0.35);
    }
    .dept-org-node.is-source {
      border-color: #c47a00;
      box-shadow: 0 0 0 3px rgba(196, 122, 0, 0.35);
      background: #fff6e8;
    }
    .dept-org-node.is-focus-target {
      border-color: #1a8f4a;
      box-shadow: 0 0 0 3px rgba(26, 143, 74, 0.4);
      background: #e8f8ef;
      animation: dept-focus-pulse 1.2s ease-in-out 2;
    }
    @keyframes dept-focus-pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }
    .dept-org-node-name {
      font-weight: 600;
      font-size: 0.86em;
      word-break: break-word;
    }
    .dept-org-node-meta {
      font-size: 0.72em;
      color: var(--text-sub);
      word-break: break-word;
    }
    .loading {
      text-align: center;
      padding: 48px;
      color: var(--text-sub);
    }
    .zoom-label {
      font-size: 0.78rem;
      color: var(--text-sub);
      min-width: 48px;
      text-align: center;
    }
    .export-select {
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 5px 8px;
      font-size: 0.82rem;
      background: var(--panel);
      color: var(--text);
      max-width: 220px;
    }
    .ctx-menu {
      position: fixed;
      z-index: 20000;
      min-width: 160px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.14);
      padding: 4px;
    }
    .ctx-menu button {
      display: block;
      width: 100%;
      border: none;
      background: transparent;
      text-align: left;
      padding: 8px 12px;
      font-size: 0.86rem;
      border-radius: 6px;
      cursor: pointer;
      color: var(--text);
    }
    .ctx-menu button:hover { background: #eef2f7; }
    .picker-overlay {
      position: fixed;
      inset: 0;
      z-index: 21000;
      background: rgba(0, 0, 0, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .picker-panel {
      width: min(480px, 94vw);
      background: var(--panel);
      border-radius: 10px;
      padding: 18px 20px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.18);
    }
    .picker-panel h3 { margin: 0 0 8px; font-size: 1rem; }
    .picker-source {
      margin: 0 0 14px;
      font-size: 0.84rem;
      color: var(--text-sub);
    }
    .picker-source strong { color: var(--text); }
    .picker-label {
      display: block;
      font-size: 0.82rem;
      margin-bottom: 6px;
      color: var(--text-sub);
    }
    .picker-input {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 0.92rem;
      margin-bottom: 8px;
    }
    .picker-input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(47, 90, 138, 0.2);
    }
    .picker-hint {
      min-height: 1.4em;
      font-size: 0.8rem;
      color: var(--text-sub);
      margin: 0 0 8px;
    }
    .picker-hint.is-error { color: #b33; }
    .picker-hint.is-ok { color: #1a8f4a; }
    .picker-match-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 160px;
      overflow: auto;
      margin-bottom: 12px;
    }
    .picker-match-btn {
      border: 1px solid var(--border);
      background: #f7f9fc;
      border-radius: 6px;
      padding: 8px 10px;
      text-align: left;
      font-size: 0.82rem;
      cursor: pointer;
    }
    .picker-match-btn:hover { background: #eef2f7; }
    .picker-match-btn.is-active {
      border-color: var(--accent);
      background: #e8f0fa;
    }
    .picker-preview {
      font-size: 0.82rem;
      padding: 10px 12px;
      background: #f7f9fc;
      border-radius: 8px;
      margin-bottom: 14px;
      line-height: 1.5;
    }
    .picker-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }
    .picker-actions .toolbar-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    .search-bar {
      position: fixed;
      top: 58px;
      right: 16px;
      z-index: 19500;
      display: none;
      align-items: center;
      gap: 8px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.14);
      min-width: min(360px, calc(100vw - 32px));
    }
    .search-bar.is-open { display: flex; }
    .search-input-wrap {
      flex: 1;
      position: relative;
      min-width: 0;
    }
    .search-input {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 7px 10px;
      font-size: 0.88rem;
    }
    .search-input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(47, 90, 138, 0.2);
    }
    .search-count {
      font-size: 0.75rem;
      color: var(--text-sub);
      white-space: nowrap;
      min-width: 44px;
      text-align: center;
    }
    .search-kbd {
      font-size: 0.72rem;
      color: var(--text-sub);
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="toolbar">
      <h1>部門組織</h1>
      <span class="toolbar-status" id="status">載入中…</span>
      <div class="root-drop" id="root-drop"
        ondragover="onDragOver(event)"
        ondragleave="onDragLeave(event)"
        ondrop="onDropRoot(event)">組織頂端（最上層）</div>
      <button type="button" class="toolbar-btn" onclick="zoomOut()">－</button>
      <span class="zoom-label" id="zoom-label">100%</span>
      <button type="button" class="toolbar-btn" onclick="zoomIn()">＋</button>
      <button type="button" class="toolbar-btn" onclick="zoomReset()">重設</button>
      <button type="button" class="toolbar-btn" onclick="reloadTree()">重新載入</button>
      <select class="export-select" id="export-format" title="輸出格式">
        <option value="html">HTML 網頁（可還原視覺）</option>
        <option value="png">PNG 圖片</option>
        <option value="json">JSON 資料</option>
        <option value="excel">Excel 清單</option>
      </select>
      <button type="button" class="toolbar-btn" onclick="exportOrg()">輸出</button>
      <button type="button" class="toolbar-btn primary" onclick="window.close()">關閉</button>
    </header>
    <div class="canvas-wrap" id="canvas-wrap">
      <div class="canvas-inner" id="canvas-inner">
        <div id="tree"><div class="loading">載入組織中…</div></div>
      </div>
    </div>
  </div>
  <div id="ctx-menu" class="ctx-menu" style="display:none;" onclick="event.stopPropagation()">
    <button type="button" onclick="openParentPickerFromMenu()">選擇部門上層</button>
  </div>
  <div id="search-bar" class="search-bar">
    <div class="search-input-wrap">
      <input id="search-input" class="search-input" type="search" list="search-suggestions"
        placeholder="搜尋部門名稱、代碼…"
        autocomplete="off"
        oninput="onSearchInput()"
        onkeydown="onSearchKeydown(event)">
      <datalist id="search-suggestions"></datalist>
    </div>
    <span class="search-count" id="search-count"></span>
    <span class="search-kbd">Enter 定位</span>
    <button type="button" class="toolbar-btn" onclick="closeSearchBar()" title="Esc 關閉">×</button>
  </div>
  <div id="parent-picker" class="picker-overlay" style="display:none;" onclick="onPickerOverlayClick(event)">
    <div class="picker-panel" onclick="event.stopPropagation()">
      <h3>選擇部門上層</h3>
      <p class="picker-source">目前部門：<strong id="picker-source-name"></strong></p>
      <label class="picker-label" for="picker-parent-input">上層部門名稱（可貼上，自動去空白）</label>
      <input id="picker-parent-input" class="picker-input" type="text"
        placeholder="貼上或輸入部門名稱，Enter 尋找"
        oninput="onPickerInput()"
        onpaste="setTimeout(onPickerInput, 0)"
        onkeydown="onPickerKeydown(event)">
      <p class="picker-hint" id="picker-hint">輸入後會自動尋找並定位到該部門</p>
      <div class="picker-match-list" id="picker-matches"></div>
      <div class="picker-preview" id="picker-preview" style="display:none;"></div>
      <div class="picker-actions">
        <button type="button" class="toolbar-btn" onclick="cancelParentPicker()">取消</button>
        <button type="button" class="toolbar-btn primary" id="picker-confirm" disabled onclick="confirmParentPicker()">確認</button>
      </div>
    </div>
  </div>
  <script>
    let dragId = '';
    let rootId = '00000000-0000-0000-0000-000000000000';
    let treeCache = [];
    let flatCache = [];
    let zoom = 1;
    let pickerSourceId = '';
    let pickerTargetId = '';
    let pickerTargetIsRoot = false;
    let searchMatches = [];
    let searchMatchIndex = -1;
    let lastSearchQuery = '';

    function nodeLabelFromFlat(item) {
      if (!item) return '';
      return item.deptName || item.shortName || item.deptCode || item.id || '';
    }

    function nodeLabelFromTree(node) {
      if (!node) return '';
      return node.deptName || node.shortName || node.deptCode || node.id || '';
    }

    function normalizeSearchText(s) {
      return String(s ?? '').trim().replace(/\s+/g, '');
    }

    function isRootKeyword(text) {
      const q = normalizeSearchText(text);
      return ['組織頂端', '頂端', '最上層', '根', 'root', '00000000-0000-0000-0000-000000000000'].includes(q.toLowerCase())
        || q === normalizeSearchText('00000000-0000-0000-0000-000000000000');
    }

    function findDeptsByQuery(query) {
      const q = normalizeSearchText(query);
      if (!q) return [];
      const exact = [];
      const partial = [];
      for (const d of flatCache) {
        const fields = [d.deptName, d.shortName, d.deptCode].filter(Boolean);
        const normalized = fields.map(normalizeSearchText);
        if (normalized.some((n) => n === q)) {
          exact.push(d);
        } else if (normalized.some((n) => n.includes(q) || q.includes(n))) {
          partial.push(d);
        }
      }
      return exact.length ? exact : partial;
    }

    function pickBestSearchIndex(matches, query) {
      if (!matches.length) return -1;
      const q = normalizeSearchText(query);
      const exactIdx = matches.findIndex((d) =>
        normalizeSearchText(d.deptName) === q
        || normalizeSearchText(d.shortName) === q
        || normalizeSearchText(d.deptCode) === q
      );
      return exactIdx >= 0 ? exactIdx : 0;
    }

    function openSearchBar() {
      const bar = document.getElementById('search-bar');
      const input = document.getElementById('search-input');
      if (!bar || !input) return;
      bar.classList.add('is-open');
      input.focus();
      input.select();
      onSearchInput();
    }

    function closeSearchBar() {
      const bar = document.getElementById('search-bar');
      const countEl = document.getElementById('search-count');
      if (bar) bar.classList.remove('is-open');
      if (countEl) countEl.textContent = '';
      searchMatches = [];
      searchMatchIndex = -1;
      lastSearchQuery = '';
    }

    function updateSearchDatalist() {
      const input = document.getElementById('search-input');
      const list = document.getElementById('search-suggestions');
      if (!input || !list) return;
      const matches = findDeptsByQuery(input.value).slice(0, 40);
      list.innerHTML = matches.map((d) => {
        const label = nodeLabelFromFlat(d);
        const meta = [d.region, d.deptCode].filter(Boolean).join(' · ');
        return `<option value="${escapeHtml(label)}">${escapeHtml(meta || label)}</option>`;
      }).join('');
    }

    function onSearchInput() {
      const input = document.getElementById('search-input');
      const countEl = document.getElementById('search-count');
      updateSearchDatalist();
      const q = normalizeSearchText(input?.value ?? '');
      if (q !== lastSearchQuery) {
        searchMatchIndex = -1;
        lastSearchQuery = '';
      }
      const preview = findDeptsByQuery(input?.value ?? '');
      if (countEl) {
        countEl.textContent = preview.length ? `${preview.length} 筆` : '';
      }
    }

    function runDeptSearch(step = 1) {
      const input = document.getElementById('search-input');
      const status = document.getElementById('status');
      const countEl = document.getElementById('search-count');
      const query = input?.value ?? '';
      const qNorm = normalizeSearchText(query);
      if (!qNorm) {
        if (status) status.textContent = '請輸入搜尋關鍵字';
        return;
      }
      if (qNorm !== lastSearchQuery) {
        lastSearchQuery = qNorm;
        searchMatches = findDeptsByQuery(query);
        searchMatchIndex = pickBestSearchIndex(searchMatches, query);
      } else if (searchMatches.length > 1) {
        searchMatchIndex = (searchMatchIndex + step + searchMatches.length) % searchMatches.length;
      } else {
        searchMatches = findDeptsByQuery(query);
        searchMatchIndex = pickBestSearchIndex(searchMatches, query);
      }
      if (!searchMatches.length) {
        if (status) status.textContent = `找不到：${query.trim()}`;
        if (countEl) countEl.textContent = '0/0';
        return;
      }
      if (searchMatchIndex < 0) searchMatchIndex = 0;
      const pick = searchMatches[searchMatchIndex];
      const name = nodeLabelFromFlat(pick);
      clearNodeHighlights();
      flyToDeptNode(pick.id);
      if (countEl) countEl.textContent = `${searchMatchIndex + 1}/${searchMatches.length}`;
      if (status) {
        status.textContent = searchMatches.length > 1
          ? `搜尋 ${searchMatchIndex + 1}/${searchMatches.length}：${name}（Enter 下一筆）`
          : `已定位：${name}`;
      }
    }

    function onSearchKeydown(event) {
      if (event.key === 'Enter') {
        event.preventDefault();
        runDeptSearch(event.shiftKey ? -1 : 1);
      } else if (event.key === 'Escape') {
        event.preventDefault();
        closeSearchBar();
      }
    }

    function wouldCreateCycle(sourceId, newParentId) {
      if (!sourceId || sourceId === newParentId) return true;
      const byId = new Map(flatCache.map((d) => [String(d.id).toLowerCase(), d]));
      let cur = String(newParentId || '').toLowerCase();
      const src = String(sourceId).toLowerCase();
      const root = String(rootId).toLowerCase();
      const seen = new Set();
      while (cur && cur !== root && !seen.has(cur)) {
        if (cur === src) return true;
        seen.add(cur);
        const node = byId.get(cur);
        cur = String(node?.parentId || '').toLowerCase();
      }
      return false;
    }

    function clearNodeHighlights() {
      document.querySelectorAll('.dept-org-node.is-source, .dept-org-node.is-focus-target')
        .forEach((n) => n.classList.remove('is-source', 'is-focus-target'));
    }

    function highlightSourceNode(deptId) {
      clearNodeHighlights();
      const el = document.querySelector(`.dept-org-node[data-dept-id="${CSS.escape(deptId)}"]`);
      if (el) el.classList.add('is-source');
    }

    function flyToDeptNode(deptId) {
      const el = document.querySelector(`.dept-org-node[data-dept-id="${CSS.escape(deptId)}"]`);
      if (!el) return false;
      document.querySelectorAll('.dept-org-node.is-focus-target').forEach((n) => n.classList.remove('is-focus-target'));
      el.classList.add('is-focus-target');
      el.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'center' });
      return true;
    }

    async function copyDeptName(deptId) {
      const item = flatCache.find((d) => String(d.id) === String(deptId));
      const name = nodeLabelFromFlat(item);
      if (!name) return;
      const status = document.getElementById('status');
      try {
        await navigator.clipboard.writeText(name);
        if (status) status.textContent = `已複製：${name}`;
      } catch (_) {
        if (status) status.textContent = `複製失敗，部門名稱：${name}`;
      }
    }

    function hideContextMenu() {
      const menu = document.getElementById('ctx-menu');
      if (menu) menu.style.display = 'none';
    }

    function onNodeContextMenu(event) {
      event.preventDefault();
      event.stopPropagation();
      const id = event.currentTarget?.dataset?.deptId || '';
      if (!id) return;
      pickerSourceId = id;
      const menu = document.getElementById('ctx-menu');
      if (!menu) return;
      menu.style.display = 'block';
      menu.style.left = `${event.clientX}px`;
      menu.style.top = `${event.clientY}px`;
    }

    function openParentPickerFromMenu() {
      hideContextMenu();
      openParentPicker(pickerSourceId);
    }

    function openParentPicker(sourceId) {
      if (!sourceId) return;
      pickerSourceId = sourceId;
      pickerTargetId = '';
      pickerTargetIsRoot = false;
      const item = flatCache.find((d) => String(d.id) === String(sourceId));
      const overlay = document.getElementById('parent-picker');
      const sourceNameEl = document.getElementById('picker-source-name');
      const input = document.getElementById('picker-parent-input');
      const hint = document.getElementById('picker-hint');
      const preview = document.getElementById('picker-preview');
      const confirmBtn = document.getElementById('picker-confirm');
      const matchesEl = document.getElementById('picker-matches');
      if (!overlay || !input) return;
      if (sourceNameEl) sourceNameEl.textContent = nodeLabelFromFlat(item);
      input.value = '';
      if (hint) {
        hint.textContent = '輸入或貼上上層部門名稱（可輸入「組織頂端」設為最上層）';
        hint.className = 'picker-hint';
      }
      if (preview) preview.style.display = 'none';
      if (matchesEl) matchesEl.innerHTML = '';
      if (confirmBtn) confirmBtn.disabled = true;
      overlay.style.display = 'flex';
      highlightSourceNode(sourceId);
      setTimeout(() => input.focus(), 50);
    }

    function cancelParentPicker() {
      const overlay = document.getElementById('parent-picker');
      if (overlay) overlay.style.display = 'none';
      pickerTargetId = '';
      pickerTargetIsRoot = false;
      clearNodeHighlights();
      hideContextMenu();
    }

    function onPickerOverlayClick(event) {
      if (event.target?.id === 'parent-picker') cancelParentPicker();
    }

    function setPickerTarget(deptId, isRoot = false) {
      pickerTargetId = deptId || '';
      pickerTargetIsRoot = !!isRoot;
      const confirmBtn = document.getElementById('picker-confirm');
      const preview = document.getElementById('picker-preview');
      const sourceItem = flatCache.find((d) => String(d.id) === String(pickerSourceId));
      const sourceName = nodeLabelFromFlat(sourceItem);
      let targetName = '組織頂端（最上層）';
      if (!isRoot) {
        const targetItem = flatCache.find((d) => String(d.id) === String(deptId));
        targetName = nodeLabelFromFlat(targetItem);
      }
      if (wouldCreateCycle(pickerSourceId, isRoot ? rootId : deptId)) {
        const hint = document.getElementById('picker-hint');
        if (hint) {
          hint.textContent = '無法選擇：會造成循環階層或不能選自己';
          hint.className = 'picker-hint is-error';
        }
        pickerTargetId = '';
        pickerTargetIsRoot = false;
        if (confirmBtn) confirmBtn.disabled = true;
        if (preview) preview.style.display = 'none';
        return;
      }
      if (preview) {
        preview.style.display = 'block';
        preview.innerHTML = `將 <strong>${escapeHtml(sourceName)}</strong> 的上層設為 <strong>${escapeHtml(targetName)}</strong>`;
      }
      if (confirmBtn) confirmBtn.disabled = false;
      if (!isRoot && deptId) flyToDeptNode(deptId);
    }

    function renderPickerMatches(matches) {
      const matchesEl = document.getElementById('picker-matches');
      if (!matchesEl) return;
      if (!matches.length) {
        matchesEl.innerHTML = '';
        return;
      }
      matchesEl.innerHTML = matches.map((d) => {
        const label = nodeLabelFromFlat(d);
        const meta = [d.region, d.deptCode].filter(Boolean).join(' · ');
        const active = String(d.id) === String(pickerTargetId) ? ' is-active' : '';
        return `<button type="button" class="picker-match-btn${active}" onclick="selectPickerMatch('${escapeHtml(d.id)}')">${escapeHtml(label)}${meta ? ` <span style="color:var(--text-sub)">· ${escapeHtml(meta)}</span>` : ''}</button>`;
      }).join('');
    }

    function selectPickerMatch(deptId) {
      pickerTargetId = deptId;
      pickerTargetIsRoot = false;
      const hint = document.getElementById('picker-hint');
      const item = flatCache.find((d) => String(d.id) === String(deptId));
      if (hint) {
        hint.textContent = `已找到：${nodeLabelFromFlat(item)}`;
        hint.className = 'picker-hint is-ok';
      }
      renderPickerMatches(findDeptsByQuery(document.getElementById('picker-parent-input')?.value || ''));
      setPickerTarget(deptId, false);
    }

    function onPickerInput() {
      const input = document.getElementById('picker-parent-input');
      const hint = document.getElementById('picker-hint');
      const confirmBtn = document.getElementById('picker-confirm');
      const preview = document.getElementById('picker-preview');
      const raw = input?.value ?? '';
      const query = normalizeSearchText(raw);
      pickerTargetId = '';
      pickerTargetIsRoot = false;
      if (confirmBtn) confirmBtn.disabled = true;
      if (preview) preview.style.display = 'none';
      if (!query) {
        if (hint) {
          hint.textContent = '請輸入或貼上上層部門名稱';
          hint.className = 'picker-hint';
        }
        renderPickerMatches([]);
        return;
      }
      if (isRootKeyword(raw)) {
        if (hint) {
          hint.textContent = '已找到：組織頂端（最上層）';
          hint.className = 'picker-hint is-ok';
        }
        renderPickerMatches([]);
        setPickerTarget(rootId, true);
        return;
      }
      const matches = findDeptsByQuery(query);
      renderPickerMatches(matches);
      if (!matches.length) {
        if (hint) {
          hint.textContent = `找不到「${raw.trim()}」相關部門`;
          hint.className = 'picker-hint is-error';
        }
        return;
      }
      const pick = matches.length === 1 ? matches[0] : matches.find((d) =>
        normalizeSearchText(d.deptName) === query
        || normalizeSearchText(d.shortName) === query
        || normalizeSearchText(d.deptCode) === query
      ) || null;
      if (pick) {
        if (hint) {
          hint.textContent = matches.length > 1
            ? `已找到 ${matches.length} 筆，已定位最接近的：${nodeLabelFromFlat(pick)}（可點選其他）`
            : `已找到：${nodeLabelFromFlat(pick)}`;
          hint.className = 'picker-hint is-ok';
        }
        selectPickerMatch(pick.id);
      } else if (hint) {
        hint.textContent = `找到 ${matches.length} 筆，請點選正確的部門`;
        hint.className = 'picker-hint';
      }
    }

    function onPickerKeydown(event) {
      if (event.key === 'Enter') {
        event.preventDefault();
        onPickerInput();
      } else if (event.key === 'Escape') {
        cancelParentPicker();
      }
    }

    async function confirmParentPicker() {
      if (!pickerSourceId) return;
      const sourceId = pickerSourceId;
      const newParentId = pickerTargetIsRoot ? rootId : pickerTargetId;
      if (!newParentId && !pickerTargetIsRoot) return;
      cancelParentPicker();
      await commitMove(sourceId, newParentId);
    }

    document.addEventListener('click', () => hideContextMenu());
    document.addEventListener('contextmenu', (e) => {
      if (!e.target.closest('.dept-org-node')) hideContextMenu();
    });

    function escapeHtml(s) {
      return String(s ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function applyZoom() {
      const inner = document.getElementById('canvas-inner');
      const label = document.getElementById('zoom-label');
      if (inner) inner.style.transform = `scale(${zoom})`;
      if (label) label.textContent = `${Math.round(zoom * 100)}%`;
    }

    const DEPT_SLOT_GAP = 16;
    const DEPT_SLOT_MIN = 120;
    const DEPT_SLOT_MAX = 200;

    function nodeSlotWidth(node) {
      const label = node?.deptName || node?.shortName || node?.deptCode || '';
      const len = String(label).length;
      return Math.min(DEPT_SLOT_MAX, Math.max(DEPT_SLOT_MIN, Math.ceil(len * 13) + 28));
    }

    function computeSubtreeWidth(node) {
      const children = Array.isArray(node?.children) ? node.children : [];
      const selfW = nodeSlotWidth(node);
      if (!children.length) return selfW;
      let total = 0;
      for (let i = 0; i < children.length; i += 1) {
        total += computeSubtreeWidth(children[i]);
        if (i > 0) total += DEPT_SLOT_GAP;
      }
      return Math.max(selfW, total);
    }

    function slotStyle(width) {
      const w = Math.ceil(width);
      return `flex:0 0 ${w}px;width:${w}px;min-width:${w}px;max-width:${w}px;`;
    }

    function zoomIn() { zoom = Math.min(2.5, Math.round((zoom + 0.1) * 10) / 10); applyZoom(); }
    function zoomOut() { zoom = Math.max(0.25, Math.round((zoom - 0.1) * 10) / 10); applyZoom(); }
    function zoomReset() { zoom = 1; applyZoom(); }

    function renderNodeBox(node) {
      const label = node.deptName || node.shortName || node.deptCode || node.id;
      const meta = [node.region, node.deptCode].filter(Boolean).join(' · ');
      return `
        <div class="dept-org-node" draggable="true" data-dept-id="${escapeHtml(node.id)}"
          ondragstart="onDragStart(event)"
          ondragend="onDragEnd(event)"
          ondragover="onDragOver(event)"
          ondragleave="onDragLeave(event)"
          ondrop="onDrop(event)"
          ondblclick="onNodeDblClick(event)"
          oncontextmenu="onNodeContextMenu(event)">
          <span class="dept-org-node-name">${escapeHtml(label)}</span>
          ${meta ? `<span class="dept-org-node-meta">${escapeHtml(meta)}</span>` : ''}
        </div>`;
    }

    function onNodeDblClick(event) {
      event.preventDefault();
      event.stopPropagation();
      const id = event.currentTarget?.dataset?.deptId || '';
      if (id) copyDeptName(id);
    }

    function renderChildrenGroup(children) {
      return `
        <div class="dept-org-tb-children dept-org-tb-slot-children">
          <div class="dept-org-tb-v-stub"></div>
          <div class="dept-org-tb-h-stack${children.length === 1 ? ' is-single' : ''}">
            ${children.map((child) => renderChildColumn(child)).join('')}
          </div>
        </div>`;
    }

    function renderChildColumn(node) {
      const slotW = computeSubtreeWidth(node);
      const children = Array.isArray(node.children) ? node.children : [];
      const childrenHtml = children.length ? renderChildrenGroup(children) : '';
      return `
        <div class="dept-org-tb-child-col" style="${slotStyle(slotW)}">
          <div class="dept-org-tb-v-link"></div>
          <div class="dept-org-tb-node-anchor">
            ${renderNodeBox(node)}
            ${childrenHtml}
          </div>
        </div>`;
    }

    function renderBranch(node) {
      const children = Array.isArray(node.children) ? node.children : [];
      const childrenHtml = children.length ? renderChildrenGroup(children) : '';
      return `
        <div class="dept-org-tb-branch">
          <div class="dept-org-tb-node-slot">${renderNodeBox(node)}</div>
          ${childrenHtml}
        </div>`;
    }

    function renderTree(nodes) {
      if (!Array.isArray(nodes) || !nodes.length) {
        return '<div class="loading">尚無部門資料</div>';
      }
      return `<div class="dept-org-tb-forest">${nodes.map((n) => renderBranch(n)).join('')}</div>`;
    }

    function paintTree() {
      const treeEl = document.getElementById('tree');
      if (treeEl) treeEl.innerHTML = renderTree(treeCache);
    }

    async function reloadTree() {
      const status = document.getElementById('status');
      const treeEl = document.getElementById('tree');
      if (status) status.textContent = '載入組織中…';
      if (treeEl) treeEl.innerHTML = '<div class="loading">載入組織中…</div>';
      if (!window.api?.sitesVisitsDeptOrgGet) {
        if (status) status.textContent = 'API 不可用';
        return;
      }
      const res = await window.api.sitesVisitsDeptOrgGet();
      if (!res?.success) {
        if (treeEl) treeEl.innerHTML = `<div class="loading">${escapeHtml(res?.error || '無法載入')}</div>`;
        if (status) status.textContent = res?.error || '載入失敗';
        return;
      }
      rootId = res.rootId || rootId;
      treeCache = res.tree || [];
      flatCache = res.flat || [];
      paintTree();
      if (status) status.textContent = `共 ${(res.flat || []).length} 個部門 · Ctrl+F 搜尋 · 雙擊複製 · 右鍵選上層`;
    }

    async function exportOrg() {
      const status = document.getElementById('status');
      const formatEl = document.getElementById('export-format');
      if (!window.api?.sitesVisitsDeptOrgExport) return;
      if (!treeCache.length) {
        alert('尚無組織資料可輸出');
        return;
      }
      const format = formatEl?.value || 'html';
      if (status) status.textContent = '輸出中…';
      const res = await window.api.sitesVisitsDeptOrgExport({
        format,
        tree: treeCache,
        flat: flatCache,
        zoom
      });
      if (res?.canceled) {
        if (status) status.textContent = '已取消輸出';
        return;
      }
      if (!res?.success) {
        if (status) status.textContent = res?.error || '輸出失敗';
        alert(res?.error || '輸出失敗');
        return;
      }
      if (status) status.textContent = `已輸出 ${format.toUpperCase()}：${res.path || ''}`;
    }

    function onDragStart(event) {
      const id = event.currentTarget?.dataset?.deptId || '';
      if (!id) return;
      dragId = id;
      event.currentTarget.classList.add('is-dragging');
      if (event.dataTransfer) {
        event.dataTransfer.effectAllowed = 'move';
        event.dataTransfer.setData('text/plain', id);
      }
    }

    function onDragEnd(event) {
      event.currentTarget?.classList.remove('is-dragging');
      document.querySelectorAll('.dept-org-node.is-drag-over, .root-drop.is-drag-over')
        .forEach((n) => n.classList.remove('is-drag-over'));
      dragId = '';
    }

    function onDragOver(event) {
      if (!dragId) return;
      event.preventDefault();
      if (event.dataTransfer) event.dataTransfer.dropEffect = 'move';
      event.currentTarget?.classList.add('is-drag-over');
    }

    function onDragLeave(event) {
      event.currentTarget?.classList.remove('is-drag-over');
    }

    async function commitMove(deptId, newParentId) {
      const status = document.getElementById('status');
      if (!deptId || deptId === newParentId) return;
      if (status) status.textContent = '更新中…';
      const res = await window.api.sitesVisitsDeptOrgMove({ deptId, newParentId });
      if (!res?.success) {
        if (status) status.textContent = res?.error || '更新失敗';
        alert(res?.error || '更新失敗');
        await reloadTree();
        return;
      }
      treeCache = res.tree || [];
      flatCache = res.flat || flatCache;
      paintTree();
      if (status) status.textContent = '已更新組織階層';
    }

    async function onDrop(event) {
      event.preventDefault();
      event.stopPropagation();
      const target = event.currentTarget;
      target?.classList.remove('is-drag-over');
      const targetId = target?.dataset?.deptId || '';
      const fromId = dragId || event.dataTransfer?.getData('text/plain') || '';
      if (!fromId || !targetId || fromId === targetId) return;
      await commitMove(fromId, targetId);
    }

    async function onDropRoot(event) {
      event.preventDefault();
      event.stopPropagation();
      event.currentTarget?.classList.remove('is-drag-over');
      const fromId = dragId || event.dataTransfer?.getData('text/plain') || '';
      if (!fromId) return;
      await commitMove(fromId, rootId);
    }

    document.getElementById('canvas-wrap')?.addEventListener('wheel', (e) => {
      if (!e.ctrlKey) return;
      e.preventDefault();
      if (e.deltaY < 0) zoomIn();
      else zoomOut();
    }, { passive: false });

    document.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && String(e.key).toLowerCase() === 'f') {
        e.preventDefault();
        openSearchBar();
      }
    });

    reloadTree();
  </script>
</body>
</html>
