    <script>
        // 引入 Electron 的 IPC 管道
        const { ipcRenderer } = require('electron');

        // --- 主題切換邏輯 ---
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
        updateThemeIcon(savedTheme);

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeIcon(newTheme);
            if(window.myChart) updateChartTheme();
        }

        function updateThemeIcon(theme) {
            document.getElementById('theme-toggle-btn').textContent = theme === 'dark' ? '☀️' : '🌙';
        }

        // --- 天氣與地圖邏輯 ---
        let myChart = null;

        window.onload = () => selectCity(25.0478, 121.5319, '台北市', 'btn-taipei');

        function handleKeyPress(event) { if (event.key === 'Enter') searchCity(); }

        // 修改：使用 IPC 通道搜尋城市
        async function searchCity() {
            const query = document.getElementById('search-input').value.trim();
            if (!query) return alert("請輸入城市名稱！");

            document.getElementById('location').textContent = "🔍 正在搜尋中...";
            updateActiveButton(''); 

            const geoUrl = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=1&language=zh&format=json`;

            // 改用 IPC 請求
            const result = await ipcRenderer.invoke('fetch-weather', geoUrl);
            if (result.success && result.data.results && result.data.results.length > 0) {
                const city = result.data.results[0];
                const lat = city.latitude.toFixed(4), lon = city.longitude.toFixed(4);
                document.getElementById('location').textContent = `📍 ${city.name} (${city.country}) (緯度: ${lat}, 經度: ${lon})`;
                fetchWeatherData(lat, lon);
            } else {
                document.getElementById('location').textContent = `⚠️ 找不到「${query}」或搜尋失敗。`;
            }
        }

        function selectCity(lat, lon, cityName, buttonId) {
            updateActiveButton(buttonId);
            document.getElementById('search-input').value = '';
            document.getElementById('location').textContent = `📍 當前城市: ${cityName} (緯度: ${lat}, 經度: ${lon})`;
            fetchWeatherData(lat, lon);
        }

        function getAutoLocation() {
            updateActiveButton('btn-auto');
            document.getElementById('search-input').value = '';
            document.getElementById('location').textContent = "🛰️ 正在獲取您的即時位置...";

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        const lat = pos.coords.latitude.toFixed(4), lon = pos.coords.longitude.toFixed(4);
                        document.getElementById('location').textContent = `📍 您的當前位置 (緯度: ${lat}, 經度: ${lon})`;
                        fetchWeatherData(lat, lon);
                    },
                    () => { document.getElementById('location').textContent = "⚠️ 自動定位失敗。"; }
                );
            }
        }

        function updateActiveButton(activeId) {
            document.querySelectorAll('.btn').forEach(btn => btn.classList.remove('active'));
            if (activeId) document.getElementById(activeId).classList.add('active');
        }

        // 修改：使用 IPC 通道獲取天氣資料
        async function fetchWeatherData(lat, lon) {
            const apiUrl = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m&daily=precipitation_probability_max,temperature_2m_max,temperature_2m_min&timezone=auto`;

            // 💡 關鍵：我們不再使用網頁 fetch()，而是派 ipcRenderer 去請 Node 幫我們下載！
            const result = await ipcRenderer.invoke('fetch-weather', apiUrl);
            
            if (result.success) {
                const data = result.data;
                document.getElementById('temp').textContent = data.current.temperature_2m;
                document.getElementById('humidity').textContent = data.current.relative_humidity_2m;
                document.getElementById('rain').textContent = data.daily.precipitation_probability_max[0];

                const dates = data.daily.time.map(date => {
                    const [, month, day] = date.split('-');
                    return `${month}/${day}`;
                });
                const maxTemps = data.daily.temperature_2m_max;
                const minTemps = data.daily.temperature_2m_min;

                renderChart(dates, maxTemps, minTemps);
            } else {
                console.error("無法取得天氣：", result.error);
                document.getElementById('location').textContent = "⚠️ 連線失敗，請檢查網路。";
            }
        }

        function renderChart(labels, maxTemps, minTemps) {
            const ctx = document.getElementById('forecastChart').getContext('2d');
            if (myChart) myChart.destroy();

            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            const textColor = isDark ? '#a0a0a0' : '#7f8c8d';
            const gridColor = isDark ? '#333333' : '#ecf0f1';

            myChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: '最高溫 (°C)',
                            data: maxTemps,
                            borderColor: '#e74c3c',
                            backgroundColor: 'rgba(231, 76, 60, 0.1)',
                            borderWidth: 2,
                            tension: 0.4,
                            fill: true
                        },
                        {
                            label: '最低溫 (°C)',
                            data: minTemps,
                            borderColor: '#3498db',
                            backgroundColor: 'rgba(52, 152, 219, 0.1)',
                            borderWidth: 2,
                            tension: 0.4,
                            fill: true
                        }
                    ]
                },
                options: {
                    responsive: true,
                    interaction: { mode: 'index', intersect: false },
                    plugins: { legend: { labels: { color: textColor } } },
                    scales: {
                        x: { ticks: { color: textColor }, grid: { color: gridColor } },
                        y: { ticks: { color: textColor }, grid: { color: gridColor } }
                    }
                }
            });
        }

        function updateChartTheme() {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            const textColor = isDark ? '#a0a0a0' : '#7f8c8d';
            const gridColor = isDark ? '#333333' : '#ecf0f1';

            myChart.options.plugins.legend.labels.color = textColor;
            myChart.options.scales.x.ticks.color = textColor;
            myChart.options.scales.x.grid.color = gridColor;
            myChart.options.scales.y.ticks.color = textColor;
            myChart.options.scales.y.grid.color = gridColor;
            myChart.update();
        }
    </script>
